debug: false

# Coin configuration is now in coin.yml
# See plugins/CoinOfTheRealm/coin.yml for coin item settings
# The coin.yml file contains all coin-related configuration including:
# - Item registration (custom item ID, fallback material, model)
# - Display properties (name, description, lore)
# - Visual effects (enchantment glint, rarity)
# - Usage behavior (use duration, animation)
# - Attribute modifiers (bonuses when held)

resource-pack:
  # URL to the resource pack ZIP file
  # This will be automatically applied to players when they join
  # Leave empty to disable automatic resource pack application
  url: "https://github.com/radawson/cotr/raw/refs/heads/main/src/main/resources/cotr-resources.zip"
  
  # SHA-1 hash of the resource pack (optional, but recommended for security)
  # Leave empty to skip hash verification
  # You can get the hash using: sha1sum cotr-resources.zip
  hash: "3a2ba2a79151c1e5fee471c4e31450a8bd270cdb"
  
  # Whether to prompt players to accept the resource pack
  # If false, resource pack will be applied automatically (may require server.properties setting)
  prompt: true

banking:
  enabled: true
  default-account-pattern: "{player-uuid}-main"
  membership-storage: "yaml"
