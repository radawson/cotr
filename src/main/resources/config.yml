debug: false

# Coin configuration is now in coin.yml
# See plugins/CoinOfTheRealm/coin.yml for coin item settings
# The coin.yml file contains all coin-related configuration including:
# - Item registration (custom item ID, fallback material, model)
# - Display properties (name, description, lore)
# - Visual effects (enchantment glint, rarity)
# - Usage behavior (use duration, animation)
# - Attribute modifiers (bonuses when held)

resource-pack:
  # URL to the resource pack ZIP file
  # This will be automatically applied to players when they join
  # Leave empty to disable automatic resource pack application
  url: "https://github.com/radawson/cotr/raw/refs/heads/main/src/main/resources/cotr-resources.zip"
  
  # SHA-1 hash of the resource pack (optional, but recommended for security)
  # Leave empty to skip hash verification
  # You can get the hash using: sha1sum cotr-resources.zip
  hash: "3a2ba2a79151c1e5fee471c4e31450a8bd270cdb"
  
  # Whether to prompt players to accept the resource pack
  # If false, resource pack will be applied automatically (may require server.properties setting)
  prompt: true
  
  # Maximum number of retry attempts (0 = no retry, default: 3)
  # If a player declines or download fails, the plugin will retry up to this many times
  max-retries: 3
  
  # Whether to kick players who decline the resource pack (requires prompt: false)
  # If true and prompt is false, players who decline will be kicked from the server
  kick-on-decline: false
  
  # Delay between retries in ticks (20 ticks = 1 second, default: 100 = 5 seconds)
  # Uses exponential backoff: first retry after this delay, second after 2x, third after 4x
  retry-delay: 100

banking:
  enabled: true
  default-account-pattern: "{player-uuid}-main"
  
  # Use our own BankController or external one
  use-own-controller: true
  # ServiceIO registration priority (LOWEST, LOW, NORMAL, HIGH, HIGHEST)
  service-priority: "NORMAL"
  
  storage:
    # Storage type: "database" or "yaml" (yaml not yet implemented for banks)
    type: "database"
    database:
      # Database type: "sqlite" or "mysql"
      type: "sqlite"
      # Table prefix for shared databases (optional, default: empty)
      # Useful when multiple plugins share the same database
      # Example: "cotr_" would create tables like "cotr_banks", "cotr_schema_version"
      prefix: ""
      # SQLite options
      file: "banks.db"
      # MySQL options (if type is mysql)
      # host: "localhost"
      # port: 3306
      # database: "cotr"
      # username: "cotr"
      # password: "password"
