# Bank Configuration
# This file controls banking storage and exchange settings.
# It is loaded separately from config.yml to keep concerns isolated.

banking:
  enabled: true
  default-account-pattern: "{player-uuid}-main"
  
  # Use our own BankController or external one
  use-own-controller: true
  # ServiceIO registration priority (LOWEST, LOW, NORMAL, HIGH, HIGHEST)
  service-priority: "NORMAL"

# Exchange configuration for emerald <-> cotr coins
exchange:
  regions:
    # Fallback region ID when no WorldGuard region applies
    fallback: "global"
  emerald:
    enabled: true
    # Base rate in coins per emerald
    base-rate: 10
    # Min and max clamp for any calculated rate
    min-rate: 1
    max-rate: 100
    # Modes: fixed, thresholds, formula, hybrid
    mode: "hybrid"
    # Optional thresholds: choose rate by emerald supply
    # The first threshold with max-emeralds >= supply is used.
    thresholds:
      - max-emeralds: 1000
        rate: 8
      - max-emeralds: 5000
        rate: 10
      - max-emeralds: 10000
        rate: 12
    # Optional formula: base-rate + floor(supply / divisor) * step
    formula:
      enabled: false
      divisor: 500
      step: 1
